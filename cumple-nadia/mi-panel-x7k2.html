<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Nadia 👑</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;font-family:'Jost',system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 80% -10%, #3b1a5e 0%, #14082b 45%, #0a0518 100%) fixed,#0a0518;
    color:#f3edff;padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto}
  h1{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;font-size:2.4rem;text-align:center;margin-bottom:4px}
  .sub{text-align:center;color:#b9a8e6;font-size:.9rem;margin-bottom:20px}
  .card{background:#1c0f38;border:1px solid #3d2a6b;border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .card h2{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;font-size:1.4rem;margin-bottom:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:rgba(255,61,139,.09);border:1px solid #3d2a6b;border-radius:14px;padding:14px;text-align:center}
  .stat .n{font-family:'Bebas Neue',Impact,sans-serif;font-size:2.4rem;color:#ff3d8b;display:block}
  .stat .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:#b9a8e6}
  .guest{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed #3d2a6b;flex-wrap:wrap}
  .guest:last-child{border-bottom:none}
  .guest b{font-weight:600}
  .tag{font-size:.75rem;padding:4px 10px;border-radius:999px;border:1px solid #3d2a6b;color:#b9a8e6;white-space:nowrap}
  .tag.si{border-color:#3dbb6e;color:#3dbb6e}
  .tag.no{border-color:#e05252;color:#e05252}
  .gmsg{width:100%;font-size:.85rem;color:#b9a8e6;font-style:italic}
  .gtime{width:100%;font-size:.7rem;color:#7a6aa8}
  .note{font-size:.78rem;color:#b9a8e6;text-align:right;margin-top:10px}
  .note a{color:#ff3d8b}
  .empty{color:#b9a8e6;text-align:center;padding:10px 0}
  .err{display:none;background:rgba(224,82,82,.12);border:1px solid #e05252;color:#ffb3b3;border-radius:12px;padding:12px;margin-top:14px;font-size:.9rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Panel de Nadia 👑</h1>
  <p class="sub">Este link es solo tuyo. A los invitados compartiles el otro (index).</p>

  <div class="card">
    <h2>¿Cuántos somos?</h2>
    <div class="stats">
      <div class="stat"><span class="n" id="stTotal">0</span><span class="l">personas en total</span></div>
      <div class="stat"><span class="n" id="stConf">0</span><span class="l">confirmaron</span></div>
      <div class="stat"><span class="n" id="stNo">0</span><span class="l">no van</span></div>
    </div>
    <p class="note">Se actualiza solo cada 15 seg · <a href="#" id="refreshNow">actualizar ahora</a></p>
    <div class="err" id="errBox"></div>
  </div>

  <div class="card">
    <h2>Lista de invitados</h2>
    <div id="guestList"><p class="empty">Todavía nadie confirmó. ¡Compartí el link!</p></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ========= CONFIGURACIÓN (misma que en index.html) ========= */
  var SUPABASE_URL = 'https://bssngnkagenhpejibkko.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzc25nbmthZ2VuaHBlamlia2tvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjY3MzksImV4cCI6MjA5NDIwMjczOX0.mo4r_g1YqF1dMnviaCTXrxOjK4snAtc2ULqG4ZHqnuc';
  /* =========================================================== */

  var API = SUPABASE_URL + '/rest/v1/rsvps?select=*&order=created_at.desc';
  var HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtTime(iso){
    try{
      var d=new Date(iso);
      return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    }catch(e){ return ''; }
  }

  function render(){
    var errBox=document.getElementById('errBox');
    errBox.style.display='none';
    if(SUPABASE_URL.indexOf('PEGAR_ACA')===0){
      errBox.textContent='Falta configurar SUPABASE_URL y SUPABASE_ANON_KEY en este archivo.';
      errBox.style.display='block'; return;
    }
    fetch(API,{headers:HEADERS}).then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    }).then(function(rows){
      /* La tabla guarda TODAS las respuestas (historial).
         Acá nos quedamos con la ÚLTIMA respuesta de cada persona (por name_key). */
      var seen={}, latest=[];
      for(var i=0;i<rows.length;i++){         // rows viene ordenado desc: la primera aparición es la más nueva
        var k=rows[i].name_key || rows[i].name.toLowerCase();
        if(!seen[k]){ seen[k]=true; latest.push(rows[i]); }
      }
      var total=0, conf=0, noVan=0, html='';
      for(var j=0;j<latest.length;j++){
        var r=latest[j], tagClass, tagText;
        if(r.status==='no'){ noVan++; tagClass='no'; tagText='No va'; }
        else{
          conf++; total += 1 + (r.companions||0);
          tagClass='si';
          tagText = r.status==='sola' ? 'Va sola/o' : 'Va +'+r.companions;
        }
        html += '<div class="guest"><b>'+escapeHtml(r.name)+'</b><span class="tag '+tagClass+'">'+tagText+'</span>';
        if(r.message) html += '<div class="gmsg">“'+escapeHtml(r.message)+'”</div>';
        html += '<div class="gtime">'+fmtTime(r.created_at)+'</div></div>';
      }
      document.getElementById('stTotal').textContent=total;
      document.getElementById('stConf').textContent=conf;
      document.getElementById('stNo').textContent=noVan;
      document.getElementById('guestList').innerHTML = html || '<p class="empty">Todavía nadie confirmó. ¡Compartí el link!</p>';
    }).catch(function(){
      errBox.textContent='No se pudo leer la base. Revisá la configuración o tu conexión.';
      errBox.style.display='block';
    });
  }

  render();
  setInterval(render,15000);
  document.getElementById('refreshNow').addEventListener('click',function(e){ e.preventDefault(); render(); });
})();
</script>
</body>
</html>
